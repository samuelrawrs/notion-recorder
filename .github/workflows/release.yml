name: Build .deb and publish apt repo

# Runs on a version tag (e.g. v1.0.0). Builds the package, attaches it to the
# GitHub Release, and (re)builds the signed apt repository published via
# GitHub Pages so users can `apt install notion-recorder`.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

# Least privilege by default: individual jobs opt in to write where needed.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dpkg-dev fakeroot

      - name: Build binary package
        run: dpkg-buildpackage -us -uc -b

      - name: Collect artifacts and checksums
        run: |
          mkdir -p dist
          mv ../*.deb dist/
          ( cd dist && sha256sums=SHA256SUMS && sha256sum *.deb > "$sha256sums" )
          ls -l dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deb
          path: |
            dist/*.deb
            dist/SHA256SUMS
          if-no-files-found: error

  # Import the signing key, build + sign the apt repo, then export ONLY the
  # generated files as an artifact. The private key is purged before this job
  # ends and never coexists with a third-party deploy action (see deploy job).
  build-apt-repo:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deb
          path: dist

      - name: Install repo tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends reprepro gnupg

      - name: Import signing key
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY secret is not set. Add it (see README) and re-run."
            exit 1
          fi
          GNUPGHOME="$(mktemp -d)"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          printf '%s' "$GPG_PRIVATE_KEY" | GNUPGHOME="$GNUPGHOME" gpg --batch --import
          FPR="$(GNUPGHOME="$GNUPGHOME" gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          echo "fpr=$FPR" >> "$GITHUB_OUTPUT"

      - name: Build apt repository
        env:
          FPR: ${{ steps.gpg.outputs.fpr }}
        run: |
          mkdir -p repo/conf
          cat > repo/conf/distributions <<EOF
          Origin: notion-recorder
          Label: Notion Recorder
          Codename: stable
          Suite: stable
          Components: main
          Architectures: amd64 arm64
          Description: Notion Recorder apt repository
          SignWith: $FPR
          EOF
          for deb in dist/*.deb; do
            reprepro -b repo includedeb stable "$deb"
          done
          # Public key users import to verify the repo (dearmored binary keyring).
          gpg --export "$FPR" > repo/notion-recorder.gpg
          # Simple landing page.
          cat > repo/index.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <title>Notion Recorder apt repository</title>
          <h1>Notion Recorder apt repository</h1>
          <p>See <a href="https://github.com/samuelrawrs/notion-recorder">the project README</a> for install instructions.</p>
          HTML
          ls -R repo

      - name: Purge signing key
        if: always()
        run: |
          if [ -n "${GNUPGHOME:-}" ] && [ -d "$GNUPGHOME" ]; then
            rm -rf "$GNUPGHOME"
          fi
          # Clear it for any later step so no key material lingers on disk.
          echo "GNUPGHOME=" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apt-repo
          path: repo
          if-no-files-found: error

  # Deploy the pre-built repo files with a third-party action. This job never
  # imports the signing key, so a compromised action cannot exfiltrate it.
  deploy:
    needs: build-apt-repo
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apt-repo
          path: repo

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./repo
          force_orphan: true

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deb
          path: dist
      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.deb
            dist/SHA256SUMS
          generate_release_notes: true
