<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 268" width="880" height="268" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa8a1"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="876" height="264" rx="24" fill="#eef4f0" stroke="#dde9e2" stroke-width="1"/>

  <!-- inputs -->
  <g>
    <rect x="40" y="52" width="212" height="66" rx="14" fill="#ffffff" stroke="#dde9e2"/>
    <text x="146" y="91" text-anchor="middle" font-size="17" font-weight="700" fill="#10201b">Your microphone</text>
    <rect x="40" y="150" width="212" height="66" rx="14" fill="#ffffff" stroke="#dde9e2"/>
    <text x="146" y="182" text-anchor="middle" font-size="17" font-weight="700" fill="#10201b">Meeting &amp; system audio</text>
  </g>

  <!-- arrows into mix -->
  <path d="M258,85 C298,85 300,134 336,134" fill="none" stroke="#9aa8a1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M258,183 C298,183 300,134 336,134" fill="none" stroke="#9aa8a1" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- mix -->
  <rect x="344" y="90" width="196" height="88" rx="18" fill="#0aa06f"/>
  <text x="442" y="130" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">Notion Meeting Mix</text>
  <text x="442" y="153" text-anchor="middle" font-size="13" font-weight="600" fill="#eafff6">capture-only virtual mic</text>

  <!-- arrow to notion -->
  <path d="M540,134 L620,134" fill="none" stroke="#9aa8a1" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- notion -->
  <rect x="628" y="90" width="212" height="88" rx="18" fill="#ffffff" stroke="#dde9e2"/>
  <text x="734" y="128" text-anchor="middle" font-size="17" font-weight="800" fill="#10201b">Notion AI</text>
  <text x="734" y="151" text-anchor="middle" font-size="15" font-weight="700" fill="#0b7a58">Meeting Notes</text>

  <!-- caption -->
  <text x="440" y="242" text-anchor="middle" font-size="13" font-weight="600" fill="#64756e">Never played to your speakers, so remote participants hear no echo. Your call keeps using your real microphone.</text>
</svg>
