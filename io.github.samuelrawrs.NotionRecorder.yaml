app-id: io.github.samuelrawrs.NotionRecorder
runtime: org.gnome.Platform
# Flathub-stable at time of writing is 48. NOTE: the runtimes installed on this
# machine are 49 and 50 (48 is not present), so a purely local build may need this
# bumped to 49 or 50 (and org.gnome.Sdk//49|50 installed) to succeed.
runtime-version: "48"
sdk: org.gnome.Sdk
command: notion-recorder

finish-args:
  # Display: Wayland preferred, X11 fallback.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Audio: CRITICAL. This connects the sandboxed pactl/parec to the host
  # pipewire-pulse (or PulseAudio) daemon. All null-sink / loopback / remap-source
  # module creation happens server-side on the host, so the routing works even
  # though the daemon lives outside the sandbox.
  - --socket=pulseaudio

# Build artifacts we do not want to ship in the final app.
cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - "*.a"
  - "*.la"

modules:
  # ---------------------------------------------------------------------------
  # PulseAudio CLIENT tools only. The GNOME runtime does NOT ship pactl/parec,
  # and the app shells out to them. We build libpulse + pactl + parec (pacat)
  # with the daemon/server, docs and every optional server feature disabled, so
  # nothing beyond the client utilities is produced. libsndfile (needed by
  # parec/pacat) is already present in org.gnome.Platform/Sdk.
  # ---------------------------------------------------------------------------
  - name: pulseaudio-utils
    buildsystem: meson
    config-opts:
      - -Ddaemon=false
      - -Dclient=true
      - -Ddoxygen=false
      - -Dman=false
      - -Dtests=false
      - -Dgcov=false
      - -Ddatabase=simple
      - -Dalsa=disabled
      - -Dasyncns=disabled
      - -Davahi=disabled
      - -Dbluez5=disabled
      - -Dbluez5-gstreamer=disabled
      - -Dconsolekit=disabled
      - -Ddbus=disabled
      - -Delogind=disabled
      - -Dfftw=disabled
      - -Dglib=disabled
      - -Dgsettings=disabled
      - -Dgstreamer=disabled
      - -Dgtk=disabled
      - -Djack=disabled
      - -Dlirc=disabled
      - -Dopenssl=disabled
      - -Dorc=disabled
      - -Doss-output=disabled
      - -Dsamplerate=disabled
      - -Dsoxr=disabled
      - -Dspeex=disabled
      - -Dsystemd=disabled
      - -Dtcpwrap=disabled
      - -Dudev=disabled
      - -Dvalgrind=disabled
      - -Dx11=disabled
      - -Dwebrtc-aec=disabled
    sources:
      - type: archive
        url: https://freedesktop.org/software/pulseaudio/releases/pulseaudio-17.0.tar.xz
        # Verified sha256 of the released 17.0 tarball (fetched from freedesktop.org).
        sha256: 053794d6671a3e397d849e478a80b82a63cb9d8ca296bd35b73317bb5ceb87b5
    # Keep only the client bits we actually use; drop server config, and anything
    # daemon=false might still have staged.
    cleanup:
      - /etc
      - /share/pulseaudio
      - /share/bash-completion
      - /share/zsh
      - /share/vala

  # ---------------------------------------------------------------------------
  # The Notion Recorder application itself. The existing Makefile already honors
  # PREFIX and installs the exact Flathub layout when PREFIX=/app:
  #   /app/bin/notion-recorder                (from notion-recorder.py)
  #   /app/bin/notion-meeting-audio
  #   /app/bin/notion-recorder-daemon
  #   /app/share/applications/io.github.samuelrawrs.NotionRecorder.desktop
  #   /app/share/icons/hicolor/scalable/apps/io.github.samuelrawrs.NotionRecorder.svg
  #   /app/share/metainfo/io.github.samuelrawrs.NotionRecorder.metainfo.xml
  #   /app/share/systemd/user/notion-recorder-daemon.service  (inert in sandbox)
  # ---------------------------------------------------------------------------
  - name: notion-recorder
    buildsystem: simple
    build-commands:
      - make install PREFIX=/app
    sources:
      # Local build source: builds straight from this checkout.
      - type: dir
        path: "."
      # For a Flathub submission, replace the `dir` source above with a pinned
      # git source, e.g.:
      #   - type: git
      #     url: https://github.com/samuelrawrs/notion-recorder.git
      #     tag: v1.0.0
      #     commit: <full-40-char-commit-sha>
